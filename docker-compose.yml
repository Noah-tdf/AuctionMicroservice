services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: auction-api-gateway
    depends_on:
      auction-service:
        condition: service_started
      user-service:
        condition: service_started
      listing-service:
        condition: service_started
      invoice-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      AUCTION_SERVICE_BASE_URL: http://auction-service:8080
      USER_SERVICE_BASE_URL: http://user-service:8080
      LISTING_SERVICE_BASE_URL: http://listing-service:8080
      INVOICE_SERVICE_BASE_URL: http://invoice-service:8080
    ports:
      - "8080:8080"
    networks:
      - public
      - backend

  auction-service:
    build:
      context: .
      dockerfile: auction-service/Dockerfile
    container_name: auction-auction-service
    depends_on:
      auction-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: auction-db
      DB_PORT: 3306
      DB_NAME: auctiondb
      DB_USER: auction
      DB_PASSWORD: auction
      USER_SERVICE_BASE_URL: http://user-service:8080
      LISTING_SERVICE_BASE_URL: http://listing-service:8080
      INVOICE_SERVICE_BASE_URL: http://invoice-service:8080
    expose:
      - "8080"
    networks:
      - backend

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: auction-user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: user-db
      DB_PORT: 3306
      DB_NAME: userdb
      DB_USER: auction
      DB_PASSWORD: auction
    expose:
      - "8080"
    networks:
      - backend

  listing-service:
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    container_name: auction-listing-service
    depends_on:
      listing-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: listing-db
      DB_PORT: 5432
      DB_NAME: listingdb
      DB_USER: auction
      DB_PASSWORD: auction
    expose:
      - "8080"
    networks:
      - backend

  invoice-service:
    build:
      context: .
      dockerfile: invoice-service/Dockerfile
    container_name: auction-invoice-service
    depends_on:
      invoice-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://auction:auction@invoice-db:27017/invoicedb?authSource=admin
    expose:
      - "8080"
    networks:
      - backend

  auction-db:
    image: mysql:8.4
    container_name: auction-auction-db
    environment:
      MYSQL_DATABASE: auctiondb
      MYSQL_USER: auction
      MYSQL_PASSWORD: auction
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  user-db:
    image: mysql:8.4
    container_name: auction-user-db
    environment:
      MYSQL_DATABASE: userdb
      MYSQL_USER: auction
      MYSQL_PASSWORD: auction
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  invoice-db:
    image: mongo:7
    container_name: auction-invoice-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: auction
      MONGO_INITDB_ROOT_PASSWORD: auction
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "auction", "-p", "auction", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  listing-db:
    image: postgres:16
    container_name: auction-listing-db
    environment:
      POSTGRES_DB: listingdb
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d listingdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: auction-phpmyadmin
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: user-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "5051:80"
    networks:
      - public
      - backend

  mongo-express:
    image: mongo-express:1.0.2
    container_name: auction-mongo-express
    depends_on:
      invoice-db:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: auction
      ME_CONFIG_MONGODB_ADMINPASSWORD: auction
      ME_CONFIG_MONGODB_SERVER: invoice-db
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "5052:8081"
    networks:
      - public
      - backend

  pgadmin:
    image: dpage/pgadmin4:8.10
    container_name: auction-pgadmin
    depends_on:
      listing-db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auction.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - public
      - backend

networks:
  public:
  backend:
    internal: true
