import java.nio.file.Files
import java.nio.file.StandardCopyOption

ext.coverageExcludes = [
        '**/*Application.class',
        '**/*Config.class',
        '**/*Request.class',
        '**/*Response.class',
        '**/*JpaEntity.class',
        '**/*Exception.class',
        '**/*DataInitializer.class',
        '**/*DomainClient.class',
        '**/AbstractDomainClient.class',
        '**/AbstractHttpDomainClient.class'
]

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    group = 'com.ryannoah'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events "PASSED", "FAILED", "SKIPPED"
            exceptionFormat "short"
        }
        finalizedBy tasks.named('jacocoTestReport')
    }

    jacocoTestReport {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: rootProject.ext.coverageExcludes)
            }))
        }
    }

    tasks.named('clean') {
        doFirst {
            File buildDirFile = layout.buildDirectory.asFile.get()
            if (!buildDirFile.exists()) {
                return
            }

            File staleDir = new File(buildDirFile.parentFile, "${buildDirFile.name}-stale-${System.currentTimeMillis()}")
            try {
                Files.move(buildDirFile.toPath(), staleDir.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } catch (Exception ex) {
                logger.warn("Could not move stale build directory ${buildDirFile} before clean: ${ex.message}")
            }
        }
    }
}

tasks.register('jacocoAllReports') {
    group = 'verification'
    description = 'Generates JaCoCo coverage reports for all services and writes a root index.'

    dependsOn subprojects.collect { it.tasks.named('jacocoTestReport') }

    def indexFile = layout.buildDirectory.file('reports/jacoco/index.html')
    outputs.file(indexFile)

    doLast {
        File staleAggregateReport = layout.buildDirectory.dir('reports/jacoco/root').get().asFile
        if (staleAggregateReport.exists()) {
            staleAggregateReport.deleteDir()
        }

        File reportIndex = indexFile.get().asFile
        reportIndex.parentFile.mkdirs()

        String rows = subprojects.collect { subproject ->
            String projectPath = subproject.path.replace(':', '')
            String htmlPath = "../../../${projectPath}/build/reports/jacoco/test/html/index.html"
            String xmlPath = "../../../${projectPath}/build/reports/jacoco/test/jacocoTestReport.xml"

            "        <tr><td>${projectPath}</td><td><a href=\"${htmlPath}\">HTML</a></td><td><a href=\"${xmlPath}\">XML</a></td></tr>"
        }.join(System.lineSeparator())

        reportIndex.text = """<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JaCoCo Reports</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #1f2933; }
        table { border-collapse: collapse; min-width: 32rem; }
        th, td { border: 1px solid #cfd7df; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #eef2f6; }
    </style>
</head>
<body>
    <h1>JaCoCo Reports</h1>
    <table>
        <thead><tr><th>Service</th><th>HTML report</th><th>XML report</th></tr></thead>
        <tbody>
${rows}
        </tbody>
    </table>
</body>
</html>
"""
    }
}

tasks.register('jacocoTestReport') {
    group = 'verification'
    description = 'Generates JaCoCo coverage reports for all services.'
    dependsOn tasks.named('jacocoAllReports')
}
