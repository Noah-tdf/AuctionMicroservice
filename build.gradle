import java.nio.file.Files
import java.nio.file.StandardCopyOption

ext.coverageExcludes = [
        '**/*Application.class',
        '**/*Config.class',
        '**/*Request.class',
        '**/*Response.class',
        '**/*JpaEntity.class',
        '**/*Document.class',
        '**/*Exception.class',
        '**/*DataInitializer.class',
        '**/*DomainClient.class',
        '**/AbstractDomainClient.class',
        '**/AbstractHttpDomainClient.class'
]

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    group = 'com.ryannoah'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    jacoco {
        toolVersion = '0.8.11'
        reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events "PASSED", "FAILED", "SKIPPED"
            exceptionFormat "short"
            showExceptions = true
            showStackTraces = true
            showStandardStreams = true
        }
        finalizedBy tasks.named('jacocoTestReport')
    }

    jacocoTestReport {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
            html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: rootProject.ext.coverageExcludes)
            }))
        }
    }

    jacocoTestCoverageVerification {
        dependsOn tasks.named('test')
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.90
                }
            }
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: rootProject.ext.coverageExcludes)
            }))
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }

    tasks.named('clean') {
        doFirst {
            File buildDirFile = layout.buildDirectory.asFile.get()
            File[] staleBuildDirs = buildDirFile.parentFile.listFiles().findAll {
                it.isDirectory() && it.name.startsWith("${buildDirFile.name}-stale-")
            }
            staleBuildDirs.each { staleBuildDir ->
                if (!staleBuildDir.deleteDir()) {
                    logger.warn("Could not delete stale build directory ${staleBuildDir}")
                }
            }

            if (!buildDirFile.exists()) {
                return
            }

            File staleDir = new File(buildDirFile.parentFile, "${buildDirFile.name}-stale-${System.currentTimeMillis()}")
            try {
                Files.move(buildDirFile.toPath(), staleDir.toPath(), StandardCopyOption.REPLACE_EXISTING)
                project.ext.cleanStaleBuildDir = staleDir
            } catch (Exception ex) {
                logger.warn("Could not move stale build directory ${buildDirFile} before clean: ${ex.message}")
            }
        }
        doLast {
            if (!project.ext.has('cleanStaleBuildDir')) {
                return
            }

            File staleDir = project.ext.cleanStaleBuildDir
            project.ext.cleanStaleBuildDir = null
            if (staleDir != null && staleDir.exists() && !staleDir.deleteDir()) {
                logger.warn("Could not delete stale build directory ${staleDir}; it may still contain locked files")
            }
        }
    }
}

tasks.register('jacocoAllReports') {
    group = 'verification'
    description = 'Generates JaCoCo coverage reports for all services and writes a root index.'

    dependsOn subprojects.collect { it.tasks.named('jacocoTestReport') }

    def indexFile = layout.buildDirectory.file('reports/jacoco/index.html')
    outputs.file(indexFile)

    doLast {
        File staleAggregateReport = layout.buildDirectory.dir('reports/jacoco/root').get().asFile
        if (staleAggregateReport.exists()) {
            staleAggregateReport.deleteDir()
        }

        File reportIndex = indexFile.get().asFile
        reportIndex.parentFile.mkdirs()

        String rows = subprojects.collect { subproject ->
            String projectPath = subproject.path.replace(':', '')
            String htmlPath = "../../../${projectPath}/build/jacocoHtml/index.html"
            String xmlPath = "../../../${projectPath}/build/customJacocoReportDir/test/jacocoTestReport.xml"

            "        <tr><td>${projectPath}</td><td><a href=\"${htmlPath}\">HTML</a></td><td><a href=\"${xmlPath}\">XML</a></td></tr>"
        }.join(System.lineSeparator())

        reportIndex.text = """<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JaCoCo Reports</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #1f2933; }
        table { border-collapse: collapse; min-width: 32rem; }
        th, td { border: 1px solid #cfd7df; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #eef2f6; }
    </style>
</head>
<body>
    <h1>JaCoCo Reports</h1>
    <table>
        <thead><tr><th>Service</th><th>HTML report</th><th>XML report</th></tr></thead>
        <tbody>
${rows}
        </tbody>
    </table>
</body>
</html>
"""
    }
}

tasks.register('jacocoTestReport') {
    group = 'verification'
    description = 'Generates JaCoCo coverage reports for all services.'
    dependsOn tasks.named('jacocoAllReports')
}
