server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.ryannoah: TRACE

spring:
  application:
    name: auction-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://auction:auction@localhost:27017/auctiondb?authSource=admin}

services:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  listing-service:
    base-url: ${LISTING_SERVICE_BASE_URL:http://localhost:8082}
  invoice-service:
    base-url: ${INVOICE_SERVICE_BASE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  enable-hateoas: false
